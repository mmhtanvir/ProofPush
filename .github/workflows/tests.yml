name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"  # oldest supported
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
      - run: python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: Show failing tests as annotations
        if: failure()
        run: |
          python - <<'PY'
          import re
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          for block in re.split(r"^={50,}$", text, flags=re.M)[1:]:
              lines = [l for l in block.strip().splitlines() if l.strip() and not set(l.strip()) <= {"-"}]
              if not lines or not lines[0].startswith(("FAIL:", "ERROR:")):
                  continue
              detail = "%0A".join(l.replace("%", "%25") for l in lines[1:][-12:])
              print(f"::error title={lines[0][:120]}::{detail}")
          PY
