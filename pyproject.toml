[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpush"
version = "0.1.0"
description = "ProofPush: Local AI Website Regression Auditor"
readme = "README.md"
authors = [{ name = "ProofPush Team" }]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "rich>=12.0",
    "pyyaml>=6.0",
    "playwright>=1.30",
    "pillow>=9.0",
]

[project.scripts]
proofpush = "proofpush.cli:main"
